<style>
  :root{
    --bg:#faf7f2; --card-bg:#ffffff; --text:#222; --sub:#777; --border:#e4ddd0; --accent:#e08b2b;
    --ok:#1e9e5a; --bad:#d64545; --dlg-h:88vh;
    --p1:#3f7fe0; --p2:#3fa15e; --p3:#e08b2b; --p4:#e0523f; --p5:#8a5cd6;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @supports (height:100dvh){ :root{ --dlg-h:88dvh; } }
  :root[data-theme="dark"]{ --bg:#1b1a17; --card-bg:#26241f; --text:#eee; --sub:#9a978f; --border:#3a362e; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Segoe UI",system-ui,sans-serif; padding:24px 14px 96px; }
  button{ -webkit-tap-highlight-color:transparent; touch-action:manipulation; font-family:inherit; }
  button:focus:not(:focus-visible){ outline:none; }

  .tools{ display:flex; justify-content:center; gap:10px; max-width:960px; margin:0 auto; align-items:center; }
  .tb-ic{ width:20px; height:20px; display:block; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .tools button{ flex:none; width:38px; height:38px; padding:0; display:inline-flex; align-items:center; justify-content:center;
    background:var(--card-bg); color:var(--text); border:1px solid var(--border); border-radius:8px; cursor:pointer; }
  .tools button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }

  .band-sw{ display:flex; max-width:560px; margin:16px auto 0; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--card-bg); }
  .band-sw button{ flex:1; padding:9px 6px; border:0; background:transparent; color:var(--text); cursor:pointer; line-height:1.25; }
  .band-sw button + button{ border-left:1px solid var(--border); }
  .band-sw button b{ display:block; font-size:.95rem; white-space:nowrap; }
  .band-sw button span{ font-size:.72rem; color:var(--sub); }
  .band-sw button.on{ background:var(--accent); color:#fff; }
  .band-sw button.on span{ color:rgba(255,255,255,.85); }
  .test-sw{ display:flex; justify-content:center; gap:7px; max-width:560px; margin:10px auto 0; flex-wrap:wrap; }
  .test-sw button, .controls button{ position:relative; overflow:hidden; height:36px; padding:0 14px; border-radius:999px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); font-size:.86rem; font-weight:600; cursor:pointer; white-space:nowrap; }
  .test-sw button.on{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .test-sw button i{ position:absolute; left:0; bottom:0; height:3px; background:var(--ok); }
  .test-sw button.on i{ background:rgba(255,255,255,.75); }
  body.exam .band-sw, body.exam .test-sw{ opacity:.5; pointer-events:none; }
  .controls{ display:flex; justify-content:center; flex-wrap:wrap; gap:7px; max-width:780px; margin:14px auto 0; }
  .controls button .cnt{ font-size:.62rem; font-weight:500; opacity:.7; margin-left:4px; }
  .controls button .dot{ display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; vertical-align:1px; }
  p.sub{ text-align:center; color:var(--sub); margin:12px 0 0; font-size:.72rem; }
  @media (max-width:600px){
    body{ padding:20px 8px 96px; }
    .band-sw button b{ font-size:.85rem; } .band-sw button span{ font-size:.64rem; }
    .controls button{ padding:0 11px; font-size:.8rem; height:34px; }
  }

  /* single question */
  #card{ max-width:760px; margin:16px auto 0; background:var(--card-bg); border:1px solid var(--border); border-radius:18px; overflow:hidden; }
  .qhead{ display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .qhead .num{ font-size:1.25rem; font-weight:800; font-variant-numeric:tabular-nums; }
  .qhead .num small{ font-size:.75rem; color:var(--sub); font-weight:600; }
  .qhead .pt{ font-size:.72rem; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; }
  .qhead .sp{ flex:1; }
  .qhead .mk{ font-weight:800; font-size:.85rem; }
  .qhead .mk.ok{ color:var(--ok); } .qhead .mk.bad{ color:var(--bad); }
  .lbl{ font-size:.68rem; color:var(--sub); padding:10px 16px 4px; letter-spacing:.02em; }
  .paper{ background:#fff; margin:0 10px; border-radius:10px; padding:8px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  
  .paper + .paper{ margin-top:6px; }
  .ctxbox{ max-height:58vh; overflow-y:auto; }
  @supports (height:100dvh){ .ctxbox{ max-height:58dvh; } }
  .crop{ position:relative; overflow:hidden; max-width:none; }
  .crop + .crop{ margin-top:10px; }
  .crop img{ position:absolute; display:block; max-width:none; height:auto; }
  .note{ margin:8px 16px 0; font-size:.8rem; color:var(--sub); }
  .note b{ color:var(--text); }
  .ans{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; padding:16px 12px 6px; }
  .op{ width:58px; height:52px; border-radius:14px; border:1px solid var(--border); background:transparent; color:var(--text); font-weight:800; font-size:1.1rem; cursor:pointer; }
  .op.sel{ background:var(--accent); border-color:var(--accent); color:#fff; }
  .op.correct{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .op.wrong{ background:var(--bad); border-color:var(--bad); color:#fff; }
  .op.ring{ border-color:var(--ok); box-shadow:inset 0 0 0 2px var(--ok); color:var(--ok); }
  .fb{ text-align:center; font-size:.85rem; min-height:22px; padding:4px 12px 0; }
  .fb .ok{ color:var(--ok); font-weight:700; } .fb .bad{ color:var(--bad); font-weight:700; }
  .fb button{ border:0; background:transparent; color:var(--sub); font-size:.8rem; cursor:pointer; text-decoration:underline; }
  .vbtn{ height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--accent); background:transparent; color:var(--accent); font-weight:700; font-size:.8rem; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .vbtn b{ font-family:"Noto Serif TC","PingFang TC",serif; font-size:.95rem; }
  .vbtn.off{ border-color:var(--border); color:var(--sub); }
  .dlg.wide{ width:min(100%, 560px); text-align:left; padding:22px 18px; }
  .vsearch{ width:100%; height:40px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--text); padding:0 12px; font-size:.9rem; margin:4px 0 10px; font-family:inherit; }
  .vh{ font-size:.7rem; color:var(--sub); margin:12px 2px 6px; letter-spacing:.02em; }
  .vlist{ border:1px solid var(--border); border-radius:12px; overflow:hidden; }

};

/* toast */
let toastT;

function toastAction(m, label, fn){
  const t = $('#toast'); t.innerHTML = `${esc(m)} <button>${esc(label)}</button>`; t.classList.add('on','act');
  t.querySelector('button').onclick = () => { t.classList.remove('on','act'); clearTimeout(toastT); fn(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on','act'), 6000);
}

/* selector + part pills */
function buildTop(){
  const lvl = key[0];
  $('#bandSw').innerHTML = ['A','B','C'].filter(l => ORDER.some(k => k[0] === l)).map(l => `<button data-l="${l}" class="${lvl===l?'on':''}"><b>Band ${l}</b><span>${LV[l].zh}</span></button>`).join('');
  $('#testSw').innerHTML = ORDER.filter(k => k[0] === lvl).map(k => { const d = Object.keys(S.data[k].ans).length; return `<button data-k="${k}" class="${key===k?'on':''}">Tes ${k[1]}${d ? `<i style="width:${d*2}%"></i>` : ''}</button>`; }).join('');
  $('#bandSw').querySelectorAll('button').forEach(b => b.onclick = () => { if(b.dataset.l === lvl) return; const same = b.dataset.l + key[1]; switchTo(ORDER.includes(same) ? same : ORDER.find(k => k[0] === b.dataset.l)); });
  $('#testSw').querySelectorAll('button').forEach(b => b.onclick = () => switchTo(b.dataset.k));
  $('#partBar').innerHTML = T.parts.map((p,i) => `<button data-p="${p.n}"><span class="dot" style="background:${PC[i]}"></span>${p.zh}<span class="cnt">${p.from}–${p.to}</span></button>`).join('');
  $('#partBar').querySelectorAll('button').forEach(b => b.onclick = () => { const p = T.parts[b.dataset.p - 1]; goQ(p.from); });
}
function switchTo(k){
  if(exam || k === key) return;
  key = k; T = R[key]; S.ui.key = k; review = null; document.body.classList.remove('reviewing'); save();
  cur = S.ui[curKey()] || 1; buildTop(); renderQ(); window.scrollTo({top:0}); toast(name(key) + ' · ' + LV[key[0]].zh);
}

/* single question view */
let cur = 1;
const curKey = () => 'cur_' + key;
function cropHTML(c, ref){
  const [pi, x, y, w, h] = c, pg = T.pages[pi];
  return `<div class="crop" style="width:min(${(w/ref*100*S.set.zoom).toFixed(3)}%, ${Math.round(w*0.62*S.set.zoom)}px);aspect-ratio:${w}/${h}"><img src="${imgSrc(pg.img)}" alt="" style="width:${(pg.w/w*100).toFixed(3)}%;left:${(-x/w*100).toFixed(3)}%;top:${(-y/h*100).toFixed(3)}%"></div>`;
}
function sharing(n){
  const q = T.Q[n-1], k = JSON.stringify(q.ctx);
  if(!q.ctx.length) return [n];
  return T.Q.filter(o => JSON.stringify(o.ctx) === k).map(o => o.n);
}
function renderQ(){
  const q = T.Q[cur-1], pi = q.part - 1, p = T.parts[pi];
  const all = q.ctx.concat(q.crop ? [q.crop] : []);
  const ref = Math.max(...all.map(c => c[3]));
  const sh = sharing(cur);
  const inScope = !exam || exam.scope.includes(cur);
  $('#card').innerHTML = `
    <div class="qhead"><span class="num">${cur}<small> / 50</small></span><span class="pt" style="background:${PC[pi]}">${p.zh}</span><span class="sp"></span><span class="mk" id="qMk"></span><button class="vbtn${exam ? ' off' : ''}" id="qVoc" title="Arti kosakata"><b>字</b>Kosakata</button></div>
    ${q.ctx.length ? `<div class="lbl">${sh.length > 1 ? `Bacaan untuk soal ${sh[0]}–${sh[sh.length-1]}` : 'Bacaan'}</div><div class="paper ctxbox">${q.ctx.map(c => cropHTML(c, ref)).join('')}</div>` : ''}
    ${q.crop ? `<div class="lbl">Soal ${cur}</div><div class="paper">${cropHTML(q.crop, ref)}</div>` : `<div class="note">Pilih jawaban untuk bagian <b>（${cur}）</b> pada bacaan di atas.</div>`}
    <div class="ans">${Array.from({length:q.nopt}, (_, i) => `<button class="op" data-i="${i}">${LET[i]}</button>`).join('')}</div>
    <div class="fb" id="qFb">${inScope ? '' : '<span style="color:var(--sub)">Soal ini di luar bagian ujian</span>'}</div>
    <div class="nav"><button id="qPrev" ${cur === 1 ? 'disabled' : ''}>‹ Sebelumnya</button><button id="qNext" class="pri" ${cur === 50 ? 'disabled' : ''}>Berikutnya ›</button></div>`;
  $('#card').querySelectorAll('.op').forEach(b => b.onclick = () => pick(+b.dataset.i));
  $('#qVoc').onclick = showVocab;
  $('#qPrev').onclick = () => goQ(cur - 1);
  $('#qNext').onclick = () => goQ(cur + 1);
  $('#partBar').querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.p === q.part));
  paintQ(); updateBar();
}
function paintQ(){
  const q = T.Q[cur-1], ops = $('#card').querySelectorAll('.op'), mk = $('#qMk'), fb = $('#qFb');
  ops.forEach(b => b.className = 'op'); mk.className = 'mk'; mk.textContent = '';
  if(exam){
    const p = exam.picks[cur]; if(p != null) ops[p].classList.add('sel');
    if(exam.scope.includes(cur)) fb.innerHTML = p != null ? '<span style="color:var(--sub)">Jawaban tersimpan — bisa diganti sampai ujian selesai</span>' : '';
    return;
  }
  const a = review ? (review.picks[cur] != null ? {pick:review.picks[cur], ok:review.picks[cur] === q.ans} : null) : D().ans[cur];
  fb.innerHTML = '';
  if(review && !a){ ops[q.ans].classList.add('ring'); mk.className = 'mk bad'; mk.textContent = 'tidak dijawab'; fb.innerHTML = `Jawaban benar: <span class="ok">${LET[q.ans]}</span>`; return; }
  if(!a) return;
  if(a.ok){ ops[a.pick].classList.add('correct'); mk.className = 'mk ok'; mk.textContent = '✓ benar'; fb.innerHTML = '<span class="ok">Benar!</span>'; }
  else { ops[a.pick].classList.add('wrong'); ops[q.ans].classList.add('ring'); mk.className = 'mk bad'; mk.textContent = '✗ salah'; fb.innerHTML = `<span class="bad">Salah.</span> Jawaban benar: <span class="ok">${LET[q.ans]}</span>`; }
  if(!review){ fb.innerHTML += ` <button id="qRedo">↻ ulangi soal ini</button>`; $('#qRedo').onclick = () => { delete D().ans[cur]; save(); paintQ(); updateBar(); buildTop(); }; }
}
function pick(i){
  const n = cur;
  if(exam){
    if(!exam.scope.includes(n)) return toast('Soal ini di luar bagian ujian');
    exam.picks[n] = i; paintQ(); updateBar(); return;
  }
  if(review || D().ans[n]) return;
  const ok = i === T.Q[n-1].ans;
  D().ans[n] = {pick:i, ok, t:Date.now()}; save(); paintQ(); updateBar(); buildTop();
}
function repaintAll(){ renderQ(); }
function goQ(n){
  if(n < 1 || n > 50) return;
  cur = n; S.ui[curKey()] = n; save(); renderQ();
  const c = $('#card'); if(c.getBoundingClientRect().top < 0) c.scrollIntoView({block:'start'});
}
document.addEventListener('keydown', e => {
  if(document.querySelector('.overlay.on') || e.target.closest('input,textarea')) return;

  else { const i = 'abcdef'.indexOf(e.key.toLowerCase()); if(i >= 0 && i < T.Q[cur-1].nopt) pick(i); else if(e.key >= '1' && e.key <= '6' && +e.key <= T.Q[cur-1].nopt) pick(+e.key - 1); }
});

function fmt(s){ s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function updateBar(){

    else { C.textContent = fmt((Date.now() - exam.start) / 1000); C.className = 'c'; }
    Rr.innerHTML = `<button class="bb" id="bSheet">Lembar</button><button class="bb pri" id="bEnd">Selesai</button>`;
    $('#bEnd').onclick = () => confirmDlg('Kumpulkan jawaban?', `${exam.scope.length - done} soal belum dijawab dan akan dihitung salah.`, 'Kumpulkan', false, finishExam);
    $('#prog').style.width = (done / exam.scope.length * 100) + '%';
  } else {
    const a = D().ans, n = Object.keys(a).length, ok = Object.values(a).filter(x => x.ok).length;
    L.innerHTML = `<b>${n}</b>/50 dijawab`;
    C.className = 'c'; C.innerHTML = n ? `<span><span class="o">✓</span> ${ok}</span><span><span class="x">✗</span> ${n-ok}</span>` : '';
    Rr.innerHTML = `<button class="bb" id="bSheet">Lembar</button><button class="bb pri" id="bExam">Ujian</button>`;
    $('#bExam').onclick = examSetup;
    $('#prog').style.width = (n / 50 * 100) + '%';
  }
  $('#bSheet').onclick = showSheet;
  $('#countSub').textContent = `${name(key)} · 50 soal` + (exam ? ' · mode ujian' : review ? ' · pembahasan' : '');
}

/* answer sheet */
function showSheet(){
  const box = $('#formBox');
  const st = n => {
    if(exam) return exam.picks[n] != null ? 'a' : '';
    if(review){ return review.picks[n] === T.Q[n-1].ans ? 'ok' : 'bad'; }
    const a = D().ans[n]; return a ? (a.ok ? 'ok' : 'bad') : '';
  };
  box.innerHTML = `<div class="x-close"><button class="x-btn" id="fx">✕</button></div>
    <div class="cf-title">Lembar jawaban · ${name(key)}</div>
    ${T.parts.map((p,i) => `<div class="qs-label" style="text-align:left;margin-top:10px"><span style="color:${PC[i]}">●</span> ${p.zh} · ${p.from}–${p.to}</div>
      <div class="sheet">${Array.from({length:p.to-p.from+1}, (_, j) => p.from + j).map(n => `<button data-n="${n}" class="${st(n)}">${n}</button>`).join('')}</div>`).join('')}
    <div class="legend">${exam ? '<span><i style="background:var(--accent)"></i>dijawab</span>' : '<span><i style="background:var(--ok)"></i>benar</span><span><i style="background:var(--bad)"></i>salah</span>'}<span><i style="border:1px solid var(--border)"></i>belum</span></div>
    <div class="qs-note">Ketuk nomor untuk menuju soalnya.</div>`;
  $('#fx').onclick = () => closeOv('#formOverlay');
  box.querySelectorAll('.sheet button').forEach(b => b.onclick = () => { closeOv('#formOverlay'); goQ(+b.dataset.n); });
  openOv('#formOverlay');
}

/* exam */
function examSetup(){
  if(exam) return;
  const box = $('#formBox'); let scope = 'all';
  const draw = () => {
    box.innerHTML = `<div class="x-close"><button class="x-btn" id="fx">✕</button></div>
      <div class="cf-title">Mulai ujian · ${name(key)}</div>
      <div class="cf-msg">Jawaban baru dinilai setelah Anda menekan <b>Selesai</b>. TOCFL Reading asli: 50 soal dalam 60 menit.</div>
      <div class="qs-row"><div class="qs-label">Soal</div><div class="seg" id="sgS"><button data-k="all" class="${scope==='all'?'on':''}">Semua</button>${T.parts.map(p => `<button data-k="${p.n}" class="${scope==String(p.n)?'on':''}">${T.parts.length > 2 ? 'B' + p.n : p.zh}</button>`).join('')}</div></div>
      <div class="qs-row"><div class="qs-label">Batas waktu</div><div class="seg" id="sgT">${[[60,'60 mnt'],[30,'30 mnt'],[0,'Tanpa batas']].map(([v,l]) => `<button data-k="${v}" class="${S.set.limit==v?'on':''}">${l}</button>`).join('')}</div>
        <div class="qs-note">Saat waktu habis, jawaban dikumpulkan otomatis.</div></div>
      <div class="cf-actions" style="margin-top:18px"><button class="cf-btn" id="fC">Batal</button><button class="cf-btn cf-yes" id="fGo">Mulai</button></div>`;
    $('#fx').onclick = $('#fC').onclick = () => closeOv('#formOverlay');
    box.querySelectorAll('#sgS button').forEach(b => b.onclick = () => { scope = b.dataset.k; draw(); });
    box.querySelectorAll('#sgT button').forEach(b => b.onclick = () => { S.set.limit = +b.dataset.k; save(); draw(); });
    $('#fGo').onclick = () => { closeOv('#formOverlay'); startExam(scope); };
  };
  draw(); openOv('#formOverlay');
}
function startExam(scope){
  const ns = T.Q.filter(q => scope === 'all' || String(q.part) === scope).map(q => q.n);
  review = null; document.body.classList.remove('reviewing');
  exam = { scope:ns, scopeName:scope, picks:{}, start:Date.now(), end: S.set.limit ? Date.now() + S.set.limit * 60000 : 0 };
  exam.timer = setInterval(() => { updateBar(); if(exam && exam.end && Date.now() >= exam.end){ toast('Waktu habis'); finishExam(); } }, 1000);
  document.body.classList.add('exam'); $('#examBtn').classList.add('on');
  goQ(ns[0]);
}
function finishExam(){
  if(!exam) return;
  clearInterval(exam.timer);
  const e = exam; exam = null;
  document.body.classList.remove('exam'); $('#examBtn').classList.remove('on');
  const res = e.scope.map(n => [n, e.picks[n] != null ? e.picks[n] : -1]);
  res.forEach(([n,p]) => { if(p >= 0) D().ans[n] = {pick:p, ok:p === T.Q[n-1].ans, t:Date.now()}; });
  const rec = { t:Date.now(), scope:e.scopeName, total:res.length, ok:res.filter(([n,p]) => p === T.Q[n-1].ans).length, dur:Math.round((Date.now() - e.start)/1000), res };
  D().hist.push(rec); if(D().hist.length > 60) D().hist.shift(); save();
  review = {picks:Object.fromEntries(res.filter(([,p]) => p >= 0))};
  review.scope = e.scope;
  document.body.classList.add('reviewing');
  buildTop(); repaintAll(); showResult(rec, true);
}
function levelOf(rec){
  if(rec.total !== 50) return null;
  const pct = rec.ok / rec.total, l = LV[key[0]].levels.find(x => pct >= x[0]);
  return [l[1], l[2]];
}
function showResult(rec, fresh){
  const box = $('#formBox');
  const per = T.parts.map(p => { const r = rec.res.filter(([n]) => n >= p.from && n <= p.to); return [r.filter(([n,x]) => x === T.Q[n-1].ans).length, r.length]; });
  const wrong = rec.res.filter(([n,p]) => p !== T.Q[n-1].ans);
  const lv = levelOf(rec);
  box.innerHTML = `<div class="x-close"><button class="x-btn" id="fx">✕</button></div>
    <div class="cf-title">${name(key)} · ${fresh ? 'Hasil ujian' : new Date(rec.t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</div>
    <div class="rp-big">${rec.ok}<small> / ${rec.total}</small></div>
    <div style="font-size:.8rem;color:var(--sub)">${Math.round(rec.ok/rec.total*100)}% benar · durasi ${fmt(rec.dur)}</div>
    ${lv ? `<div class="rp-lvl" style="background:${lv[1]}">${lv[0]}</div><div class="qs-note">Perkiraan kasar, bukan skor resmi TOCFL.</div>` : ''}
    <div class="rp-sec" style="margin-top:18px"><div class="rp-h">Per bagian</div><div class="bars">
      ${T.parts.map((p,i) => per[i][1] ? `<div class="bar-row"><span>${p.zh}</span><span class="bt"><i style="width:${per[i][0]/per[i][1]*100}%;background:${PC[i]}"></i></span><span class="bv">${per[i][0]}/${per[i][1]}</span></div>` : '').join('')}
    </div></div>
    <div class="rp-sec"><div class="rp-h">${wrong.length ? 'Jawaban salah — ketuk untuk melihat soalnya' : 'Semua benar!'}</div>
      ${wrong.length ? `<div class="sheet">${wrong.map(([n]) => `<button class="bad" data-n="${n}">${n}</button>`).join('')}</div>` : ''}</div>
    <div class="rp-actions">${fresh ? '<button class="cf-btn cf-yes" id="rRev">Lihat pembahasan</button>' : ''}<button class="cf-btn" id="rClose">Tutup</button></div>`;
  $('#fx').onclick = $('#rClose').onclick = () => closeOv('#formOverlay');
  if($('#rRev')) $('#rRev').onclick = () => { closeOv('#formOverlay'); goQ(wrong.length ? wrong[0][0] : rec.res[0][0]); };
  box.querySelectorAll('.sheet button').forEach(b => b.onclick = () => {
    if(!fresh){ review = {picks:Object.fromEntries(rec.res.filter(([,p]) => p >= 0))}; document.body.classList.add('reviewing'); repaintAll(); }
    closeOv('#formOverlay'); goQ(+b.dataset.n);
  });
  openOv('#formOverlay');
}
$('#revEnd').onclick = () => { review = null; document.body.classList.remove('reviewing'); repaintAll(); };

/* report */
function showReport(){
  const box = $('#formBox'), a = D().ans, n = Object.keys(a).length, ok = Object.values(a).filter(x => x.ok).length, H = D().hist;
  const best = H.length ? Math.max(...H.map(h => Math.round(h.ok / h.total * 100))) : null;
  const per = T.parts.map(p => { const qs = Object.keys(a).map(Number).filter(x => x >= p.from && x <= p.to); return [qs.filter(x => a[x].ok).length, qs.length]; });
  box.innerHTML = `<div class="x-close"><button class="x-btn" id="fx">✕</button></div>
    <div class="cf-title">Laporan · ${name(key)}</div>
    <div class="rp-stats"><div class="rp-stat"><div class="rp-num">${n}<span style="font-size:.8rem;color:var(--sub)">/50</span></div><div class="rp-lbl">Dijawab</div></div>
      <div class="rp-stat"><div class="rp-num">${n ? Math.round(ok/n*100) + '%' : '–'}</div><div class="rp-lbl">Benar</div></div>
      <div class="rp-stat"><div class="rp-num">${best != null ? best + '%' : '–'}</div><div class="rp-lbl">Ujian terbaik</div></div></div>
    <div class="rp-sec"><div class="rp-h">Ketepatan per bagian</div><div class="bars">${T.parts.map((p,i) => `<div class="bar-row"><span>${p.zh}</span><span class="bt"><i style="width:${per[i][1] ? per[i][0]/per[i][1]*100 : 0}%;background:${PC[i]}"></i></span><span class="bv">${per[i][0]}/${per[i][1]}</span></div>`).join('')}</div></div>
    <div class="rp-sec"><div class="rp-h">Riwayat ujian</div>${H.length ? `<div class="rp-list">${H.slice().reverse().slice(0,15).map((h,i) => `<button class="rp-row" data-i="${H.length-1-i}"><span class="t">${new Date(h.t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})} · ${h.scope === 'all' ? 'Semua' : T.parts[h.scope-1].zh}</span><span class="r ${h.ok/h.total >= .6 ? 'ok' : 'bad'}">${h.ok}/${h.total}</span></button>`).join('')}</div>` : '<div class="rp-empty">Belum ada ujian.</div>'}</div>`;
  $('#fx').onclick = () => closeOv('#formOverlay');
  box.querySelectorAll('.rp-row').forEach(r => r.onclick = () => showResult(H[+r.dataset.i], false));
  openOv('#formOverlay');
}

/* settings */
function showSettings(){
  const box = $('#formBox');
  const draw = () => {
    const th = document.documentElement.getAttribute('data-theme');
    box.innerHTML = `<div class="x-close"><button class="x-btn" id="fx">✕</button></div>
      <div class="cf-title" style="margin-bottom:16px">Pengaturan</div>
      <div class="qs-row"><div class="qs-label">Tema</div><div class="seg" id="sT"><button data-k="dark" class="${th==='dark'?'on':''}">Gelap</button><button data-k="light" class="${th==='light'?'on':''}">Terang</button></div></div>
      <div class="qs-row"><div class="qs-label">Ukuran teks soal</div><div class="seg" id="sZ">${[[1,'100%'],[1.5,'150%'],[2,'200%']].map(([v,l]) => `<button data-k="${v}" class="${S.set.zoom==v?'on':''}">${l}</button>`).join('')}</div>
        <div class="qs-note">Jika diperbesar, soal bisa digeser ke samping. Anda juga bisa mencubit layar untuk memperbesar.</div></div>`;
    $('#fx').onclick = () => closeOv('#formOverlay');
    box.querySelectorAll('#sT button').forEach(b => b.onclick = () => { document.documentElement.setAttribute('data-theme', b.dataset.k); try{ localStorage.setItem('tocfl-theme-v1', b.dataset.k); }catch(e){} draw(); });
    box.querySelectorAll('#sZ button').forEach(b => b.onclick = () => { S.set.zoom = +b.dataset.k; save(); applyZoom(); draw(); });
  };
  draw(); openOv('#formOverlay');
}
function applyZoom(){ $('#zoomBtn').classList.toggle('on', S.set.zoom > 1); if($('#card').innerHTML) renderQ(); }

/* dialogs */
function openOv(id){ if(id === '#formOverlay' && !$('#formBox').querySelector('.vsearch')) $('#formBox').classList.remove('wide'); $(id).classList.add('on'); }
function closeOv(id){ $(id).classList.remove('on'); }
function confirmDlg(title, msg, yes, danger, fn){
  $('#confirmBox').innerHTML = `<div class="cf-title">${title}</div><div class="cf-msg">${msg}</div><div class="cf-actions"><button class="cf-btn" id="cNo">Batal</button><button class="cf-btn cf-yes ${danger?'cf-danger':''}" id="cYes">${yes}</button></div>`;
  $('#cNo').onclick = () => closeOv('#confirmOverlay');
  $('#cYes').onclick = () => { closeOv('#confirmOverlay'); fn(); };
  openOv('#confirmOverlay');
}
['#formOverlay','#confirmOverlay'].forEach(id => $(id).addEventListener('click', e => { if(e.target === $(id)) closeOv(id); }));

/* wiring */
$('#setBtn').onclick = showSettings;
$('#examBtn').onclick = () => exam ? toast('Ujian sedang berjalan — tekan Selesai di bawah') : examSetup();
$('#sheetBtn').onclick = showSheet;
$('#reportBtn').onclick = () => exam ? toast('Selesaikan ujian dulu') : showReport();
$('#zoomBtn').onclick = () => { S.set.zoom = S.set.zoom === 1 ? 1.5 : S.set.zoom === 1.5 ? 2 : 1; save(); applyZoom(); toast('Ukuran teks soal ' + Math.round(S.set.zoom * 100) + '%'); };
$('#resetBtn').onclick = () => {
  if(exam) return toast('Selesaikan ujian dulu');
  const n = Object.keys(D().ans).length;
  if(!n) return toast('Belum ada jawaban di ' + name(key));
  const keep = D().ans, k = key;
  D().ans = {}; review = null; document.body.classList.remove('reviewing'); save(); buildTop(); repaintAll(); goQ(1);
  toastAction(`${n} jawaban dihapus — mulai dari awal`, 'Batalkan', () => { S.data[k].ans = keep; save(); buildTop(); repaintAll(); toast('Jawaban dikembalikan'); });
};
window.addEventListener('beforeunload', e => { if(exam){ e.preventDefault(); e.returnValue = ''; } });
cur = S.ui[curKey()] || 1; applyZoom(); buildTop(); renderQ();
</script>
</body>
</html>
